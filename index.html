<title>DunaSava CRM</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (desktop) / top scrolling tab bar (phone); content column with summary tiles first, detail tables below */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeea; --line:#d3dcd6;
  --fg:#12201a; --muted:#5b6b63;
  --accent:#0b2a1f; --accent-fg:#ffffff; --accent-soft:#dbe8e1; --accent-2:#2e7d5b;
  --rail-bg:#0b2a1f; --rail-fg:#d9e6df; --rail-muted:#7f9c90; --rail-on:#163f30;
  --good:#1f7a4d; --good-soft:#dcf1e5; --warn:#a2650a; --warn-soft:#fbeccf; --bad:#b4312c; --bad-soft:#f8dcda;
  --shadow:0 1px 2px rgba(11,42,31,.06),0 4px 14px rgba(11,42,31,.05);
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:12px; --rail:232px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#161f1b; --surface-2:#1e2a25; --line:#2b3a33;
  --fg:#e6ede9; --muted:#95a89f;
  --accent:#5fc79a; --accent-fg:#06110c; --accent-soft:#1a3328; --accent-2:#7ad4ae;
  --rail-bg:#0a1a13; --rail-fg:#d9e6df; --rail-muted:#7f9c90; --rail-on:#163f30;
  --good:#5fc48f; --good-soft:#15392a; --warn:#e3b35b; --warn-soft:#3f2f12; --bad:#f08a84; --bad-soft:#4a1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#161f1b; --surface-2:#1e2a25; --line:#2b3a33;
  --fg:#e6ede9; --muted:#95a89f;
  --accent:#5fc79a; --accent-fg:#06110c; --accent-soft:#1a3328; --accent-2:#7ad4ae;
  --rail-bg:#0a1a13; --rail-fg:#d9e6df; --rail-muted:#7f9c90; --rail-on:#163f30;
  --good:#5fc48f; --good-soft:#15392a; --warn:#e3b35b; --warn-soft:#3f2f12; --bad:#f08a84; --bad-soft:#4a1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:20px;font-weight:600}
h2{font-size:16px;font-weight:600}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--rail-bg);color:var(--rail-fg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-size:19px;letter-spacing:.14em;font-weight:700;color:#fff}
.brand b span{color:var(--accent-2);}
.brand small{color:var(--rail-muted);font-size:12px;display:block;margin-top:2px}
.nav{display:flex;flex-direction:column;padding:10px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--rail-fg)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--rail-on);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent-2)}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted);padding:14px 10px 4px}
.nav svg{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .kat{position:absolute;left:10px;top:10px}
.pcard .pb{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .kod{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pcard .ad{font-weight:600;line-height:1.3}
.pcard .spec{font-size:12px;color:var(--muted);line-height:1.4}
.pcard .pr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.pcard .pr b{font-size:19px;font-family:var(--font-mono)}
.pcard .pr small{color:var(--muted);font-size:11px}
.kgrp{margin-bottom:26px}
.kban{display:flex;gap:16px;align-items:stretch;background:var(--accent);color:#fff;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.kban img{width:220px;flex:0 0 220px;object-fit:cover;display:block;max-width:40%}
.kban .kinfo{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kban h2{color:#fff;font-size:17px}
.kban p{margin:0;font-size:13px;color:#d9e6df;line-height:1.45}
.kban .cs{display:flex;flex-wrap:wrap;gap:4px}
.kban .cs .pill{background:rgba(255,255,255,.14);color:#fff}
.kban .note{color:#a9c2b6}
@media (max-width:600px){.kban{flex-direction:column}.kban img{width:100%;max-width:100%;height:150px;flex:none}}
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--rail-bg)}
.lbox{background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:100%;max-width:380px;padding:8px 24px 24px;display:flex;flex-direction:column;gap:12px}
.lbox .brand{padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lbox .brand b{color:var(--accent)} .lbox .brand b span{color:var(--accent-2)} .lbox .brand small{color:var(--muted)}
.lbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.lbox .lerr{color:var(--bad);font-size:13px;min-height:18px}
.lbox .btn{padding:10px}
.uinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto;font-size:12px;color:var(--rail-muted)}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rail-muted);margin-right:6px;transition:background .3s}.syncdot.on{background:var(--accent-2)}
.uinfo b{display:block;color:var(--rail-fg);font-weight:500;font-size:13px}
.uinfo button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--rail-fg);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
@media (max-width:860px){.uinfo{display:none}}
.langsw{display:inline-flex;gap:2px;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px}
.langsw button{border:0;background:none;color:var(--rail-muted);font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer;font-weight:600}
.langsw button.on{background:rgba(255,255,255,.14);color:#fff}
.lbox .langsw{border-color:var(--line);align-self:flex-end}.lbox .langsw button{color:var(--muted)}.lbox .langsw button.on{background:var(--accent-soft);color:var(--accent)}
.brand .langsw{margin-top:8px}
.blogo{width:64px;height:64px;border-radius:50%;background:#fff;display:block;margin-bottom:8px}
.brand.row{display:flex;align-items:center;gap:12px}.brand.row .blogo{margin:0;width:52px;height:52px}
.lbox .blogo{width:110px;height:110px;margin:0 auto 10px}
.thumb{width:44px;height:34px;object-fit:cover;border-radius:5px;background:var(--surface-2);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.main{flex:1;min-width:0;padding-block:20px;padding-inline:24px;max-width:1280px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.topbar .sub{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .val{font-size:22px;font-weight:600;margin-top:4px}
.tile .cap{font-size:12px;color:var(--muted);margin-top:2px}
.tile.bad .val{color:var(--bad)} .tile.good .val{color:var(--good)} .tile.warn .val{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card .body{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tbw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.row:hover td{background:var(--surface-2);cursor:pointer}
td.wrap{white-space:normal;min-width:160px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.frm label.full{grid-column:1/-1}
.frm label > span b{color:var(--bad)}
.lines{grid-column:1/-1;overflow-x:auto}
.lines table td{padding:4px}
.lines input,.lines select{padding:5px 7px}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:860px;margin-top:env(safe-area-inset-top,0px)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .body{padding:16px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b i.alt{background:var(--good)}
.bars .b small{font-size:10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.note{font-size:12px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;flex-direction:row!important}
.chk input{width:auto}
.ex{font-size:11px;color:var(--muted);font-style:italic}
@media (max-width:860px){
  .app{flex-direction:column}
  .rail{width:auto;flex:none;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .brand{padding:12px 16px 8px;border:0}
  .brand b{font-size:16px}
  .nav{flex-direction:row;overflow-x:auto;padding:0 8px 8px;gap:4px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .main{padding-inline:16px;padding-block:16px}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

/* ---- Firestore veri katmanı: crm/{koleksiyon}/items/{id}, ayarlar crm_meta/ayar ---- */
const COLS=['cari','urun','alis','satis','kasa','stokHareket','arac','aracGider','depo','kira','teklif'];
let DB=null, SNAP={}, SAVING=false, DIRTY=false;
const clone=o=>JSON.parse(JSON.stringify(o));
async function loadAll(){
 const ayarDoc=await fdb.collection('crm_meta').doc('ayar').get();
 if(!ayarDoc.exists){ DB=seed(); SNAP={}; await save(true); return; }
 DB={ayar:ayarDoc.data()};
 for(const c of COLS){ const s=await fdb.collection('crm').doc(c).collection('items').get(); DB[c]=s.docs.map(d=>d.data()); }
 SNAP=snapOf(DB); ayarTamamla(); await save();
 // canlı eşitleme: başka cihazdan gelen değişiklikleri yansıt
 for(const c of COLS){ UNSUBS.push(fdb.collection('crm').doc(c).collection('items').onSnapshot(s=>{ if(SAVING) return; const arr=s.docs.map(d=>d.data()); const j=JSON.stringify(arr); if(j!==JSON.stringify(DB[c])){ DB[c]=arr; SNAP[c]=Object.fromEntries(arr.map(x=>[x.id,JSON.stringify(x)])); if(!MODAL) render(); } })); }
 UNSUBS.push(fdb.collection('crm_meta').doc('ayar').onSnapshot(d=>{ if(SAVING||!d.exists) return; if(JSON.stringify(d.data())!==JSON.stringify(DB.ayar)){ DB.ayar=d.data(); SNAP.ayar=JSON.stringify(DB.ayar); if(!MODAL) render(); } }));
}
function snapOf(db){ const o={ayar:JSON.stringify(db.ayar)}; for(const c of COLS) o[c]=Object.fromEntries((db[c]||[]).map(x=>[x.id,JSON.stringify(x)])); return o; }
async function save(ilk){
 if(!DB) return;
 SAVING=true;
 try{
  const ops=[]; const now=snapOf(DB);
  if(now.ayar!==SNAP.ayar) ops.push(['set',fdb.collection('crm_meta').doc('ayar'),DB.ayar]);
  for(const c of COLS){ const col=fdb.collection('crm').doc(c).collection('items'); const prev=SNAP[c]||{};
   for(const x of DB[c]||[]){ if(prev[x.id]!==now[c][x.id]) ops.push(['set',col.doc(x.id),x]); }
   for(const id of Object.keys(prev)){ if(!now[c][id]) ops.push(['del',col.doc(id)]); } }
  for(let i=0;i<ops.length;i+=400){ const b=fdb.batch(); ops.slice(i,i+400).forEach(([t,ref,data])=>t==='set'?b.set(ref,clone(data)):b.delete(ref)); await b.commit(); }
  SNAP=now;
  if(ops.length&&!ilk) kaydetBildir(ops.length);
 }catch(e){ console.error(e); toast('Buluta kaydedilemedi: '+(e.code||e.message)); }
 finally{ SAVING=false; }
}
function kaydetBildir(n){ const el=document.getElementById('syncdot'); if(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1200); } }

/* ===================== HESAPLAMALAR ===================== */
const cariById=id=>DB.cari.find(c=>c.id===id);
const urunById=id=>DB.urun.find(u=>u.id===id);
const cariAd=id=>cariById(id)?.ad||'—';
function belgeAra(b){ return b.kalemler.reduce((s,k)=>s+n2(k.miktar*k.fiyat),0); }
function belgeKdv(b){ return n2(belgeAra(b)*(b.kdv||0)/100); }
function belgeToplam(b){ return n2(belgeAra(b)+belgeKdv(b)); }
function cariBakiye(id){
 const c=cariById(id); if(!c) return 0;
 if(c.tip==='musteri'){ const borc=DB.satis.filter(s=>s.cariId===id).reduce((a,s)=>a+belgeToplam(s),0); const tah=DB.kasa.filter(k=>k.cariId===id&&k.tip==='tahsilat').reduce((a,k)=>a+ +k.tutar,0); return n2(borc-tah); }
 const borc=DB.alis.filter(s=>s.cariId===id).reduce((a,s)=>a+belgeToplam(s),0); const od=DB.kasa.filter(k=>k.cariId===id&&k.tip==='odeme').reduce((a,k)=>a+ +k.tutar,0); return n2(borc-od);
}
function stokMiktar(uid_){
 let q=0;
 DB.alis.forEach(a=>a.kalemler.forEach(k=>{ if(k.urunId===uid_) q+= +k.miktar; }));
 DB.satis.forEach(s=>s.kalemler.forEach(k=>{ if(k.urunId===uid_) q-= +k.miktar; }));
 DB.stokHareket.forEach(h=>{ if(h.urunId===uid_) q+= +h.miktar; });
 return n2(q);
}
function hareketVar(uid_){ return DB.alis.some(a=>a.kalemler.some(k=>k.urunId===uid_))||DB.satis.some(a=>a.kalemler.some(k=>k.urunId===uid_))||DB.stokHareket.some(h=>h.urunId===uid_); }
const dusukStok=u=>(+u.minStok||0)>0&&hareketVar(u.id)&&stokMiktar(u.id)<(+u.minStok||0);
function stokDeger(){ return DB.urun.reduce((a,u)=>a+stokMiktar(u.id)*(+u.alisFiyat||0),0); }
function kasaBakiye(hesap){
 return n2(DB.kasa.filter(k=>!hesap||k.hesap===hesap).reduce((a,k)=>a+(k.tip==='tahsilat'?+k.tutar:-k.tutar),0));
}
function acikAlacak(){ return DB.cari.filter(c=>c.tip==='musteri').reduce((a,c)=>a+Math.max(0,cariBakiye(c.id)),0); }
function acikBorc(){ return DB.cari.filter(c=>c.tip==='tedarikci').reduce((a,c)=>a+Math.max(0,cariBakiye(c.id)),0); }
function vadesiGecen(){ const t=today(); return DB.satis.filter(s=>s.vade&&s.vade<t&&cariBakiye(s.cariId)>0); }
function nextNo(tip){ if(tip==='satis'){ DB.ayar.satisNo=(DB.ayar.satisNo||1000)+1; return 'S-'+DB.ayar.satisNo; } DB.ayar.alisNo=(DB.ayar.alisNo||500)+1; return 'A-'+String(DB.ayar.alisNo).padStart(4,'0'); }

function go(v,p){ VIEW=v; PARAM=p||null; render(); window.scrollTo(0,0); }

function page(title,sub,actions,body){

}
function tbl(cols,rows,opts={}){
 if(!rows.length) return `<div class="empty">${opts.empty||'Kayıt yok'}</div>`;
 return `<div class="tbw"><table><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${opts.onRow?'row':''}" ${opts.onRow?`onclick="${opts.onRow(r)}"`:''}>${cols.map(c=>`<td class="${c.r?'r num':''} ${c.wrap?'wrap':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function pillBakiye(v){ if(v>0.005) return `<span class="pill bad">${fmt(v)}</span>`; if(v<-0.005) return `<span class="pill good">${fmt(-v)} alacaklı</span>`; return `<span class="pill good">0,00</span>`; }
function sel(name,opts,val,attrs=''){ return `<select name="${name}" id="f_${name}" ${attrs}>${opts.map(o=>`<option value="${esc(o.v)}" ${o.v==val?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`; }
function inp(name,val,type='text',attrs=''){ return `<input name="${name}" id="f_${name}" type="${type}" value="${esc(val??'')}" ${attrs}>`; }
function fld(lbl,html,full,req){ return `<label class="${full?'full':''}"><span>${lbl}${req?' <b>*</b>':''}</span>${html}</label>`; }
let MODAL=null;
function modal(title,bodyHtml,onOk,okLbl='Kaydet'){
 closeModal();
 const d=document.createElement('div'); d.className='modal-bg'; d.id='modalbg';
 d.innerHTML=`<div class="modal" role="dialog" aria-label="${esc(title)}"><header><h2>${title}</h2><button class="btn sm" onclick="closeModal()">Kapat</button></header><form id="mform" class="body"><div class="frm">${bodyHtml}</div></form><footer><button class="btn" type="button" onclick="closeModal()">Vazgeç</button><button class="btn pri" type="button" id="mok">${okLbl}</button></footer></div>`;
 document.body.appendChild(d); MODAL=d; translateDOM(d);
 d.addEventListener('click',e=>{ if(e.target===d) closeModal(); });
 $('#mform').addEventListener('submit',e=>e.preventDefault());
 $('#mok').onclick=()=>{ const f=$('#mform'); const data={}; new FormData(f).forEach((v,k)=>data[k]=v); f.querySelectorAll('input[type=checkbox]').forEach(c=>data[c.name]=c.checked); const r=onOk(data,f); if(r!==false){ save(); closeModal(); render(); } };
 const first=d.querySelector('input,select,textarea'); if(first) first.focus();
}
function closeModal(){ if(MODAL){ MODAL.remove(); MODAL=null; } }
function confirmDel(msg,fn){ modal('Silme onayı',`<div class="full">${msg}</div>`,()=>{ fn(); toast('Silindi'); },'Evet, sil'); }
function req(data,keys){ for(const k of keys){ if(!String(data[k]??'').trim()){ toast('Zorunlu alan boş: '+k); return false; } } return true; }

/* ===================== ÖZET ===================== */
function vOzet(){
 const t=today(), bu=ym(t);
 const satisAy=DB.satis.filter(s=>ym(s.tarih)===bu).reduce((a,s)=>a+belgeToplam(s),0);
 const tahAy=DB.kasa.filter(k=>k.tip==='tahsilat'&&ym(k.tarih)===bu).reduce((a,k)=>a+ +k.tutar,0);
 const gecen=vadesiGecen(); const gecenT=gecen.reduce((a,s)=>a+belgeToplam(s),0);
 const dusuk=DB.urun.filter(dusukStok);
 const kiraAcik=DB.kira.filter(k=>!k.odendi);
 const uyari=[];
 DB.arac.forEach(a=>{ if(a.sigortaBitis&&a.sigortaBitis<addDays(t,30)) uyari.push(`${a.plaka}: sigorta ${a.sigortaBitis<t?'bitmiş':'yakında bitiyor'} (${dstr(a.sigortaBitis)})`); if(a.muayeneBitis&&a.muayeneBitis<addDays(t,30)) uyari.push(`${a.plaka}: muayene ${a.muayeneBitis<t?'geçmiş':'yakında'} (${dstr(a.muayeneBitis)})`); });
 DB.depo.forEach(d=>{ if(d.kontratBitis&&d.kontratBitis<addDays(t,60)) uyari.push(`${d.ad}: kira kontratı ${dstr(d.kontratBitis)} tarihinde bitiyor`); });
 kiraAcik.forEach(k=>uyari.push(`${DB.depo.find(d=>d.id===k.depoId)?.ad||'Depo'}: ${k.donem} kirası ödenmedi (${fmt(k.tutar)})`));
 dusuk.forEach(u=>uyari.push(`Düşük stok: ${u.ad} — ${fmtQ(stokMiktar(u.id))} ${u.birim} (min ${fmtQ(u.minStok)})`));
 gecen.forEach(s=>uyari.push(`Vadesi geçti: ${s.no} ${cariAd(s.cariId)} — ${fmt(belgeToplam(s))}, vade ${dstr(s.vade)}`));
 // 6 aylık satış/tahsilat
 const months=[]; for(let i=5;i>=0;i--){ const d=new Date(t); d.setDate(1); d.setMonth(d.getMonth()-i); const k=d.toISOString().slice(0,7); months.push({k,l:AYLAR[d.getMonth()],s:DB.satis.filter(x=>ym(x.tarih)===k).reduce((a,x)=>a+belgeToplam(x),0),th:DB.kasa.filter(x=>x.tip==='tahsilat'&&ym(x.tarih)===k).reduce((a,x)=>a+ +x.tutar,0)}); }
 const mx=Math.max(1,...months.map(m=>Math.max(m.s,m.th)));
 const son=[...DB.satis.map(s=>({t:s.tarih,tip:'Satış',ref:s.no,k:cariAd(s.cariId),v:belgeToplam(s),go:`go('satis')`})),...DB.alis.map(s=>({t:s.tarih,tip:'Alış',ref:s.no,k:cariAd(s.cariId),v:-belgeToplam(s),go:`go('alis')`})),...DB.kasa.map(k=>({t:k.tarih,tip:k.tip==='tahsilat'?'Tahsilat':k.tip==='odeme'?'Ödeme':'Gider',ref:k.hesap==='banka'?'Banka':'Kasa',k:k.cariId?cariAd(k.cariId):(k.kategori||k.aciklama),v:k.tip==='tahsilat'?+k.tutar:-k.tutar,go:`go('kasa')`}))].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,10);
 return page('Özet',`${dstr(t)} · ${DB.ayar.firma}`,`<button class="btn pri" onclick="editSatis()">+ Satış</button><button class="btn" onclick="editKasa('tahsilat')">+ Tahsilat</button>`,`
 ${DB.ayar.ornek?`<div class="card"><div class="body note">Uygulama örnek verilerle açıldı. Gerçek kayıtlara başlamak için <b>Ayarlar &amp; Yedek → Örnek verileri temizle</b> seçeneğini kullanın.</div></div>`:''}
 <div class="tiles">
  <div class="tile bad"><div class="lbl">Açık alacak</div><div class="val num">${fmt(acikAlacak())}</div><div class="cap">${gecen.length} belge vadesi geçmiş · ${fmt(gecenT)}</div></div>
  <div class="tile warn"><div class="lbl">Tedarikçi borcu</div><div class="val num">${fmt(acikBorc())}</div><div class="cap">ödenecek</div></div>
  <div class="tile good"><div class="lbl">Kasa + Banka</div><div class="val num">${fmt(kasaBakiye())}</div><div class="cap">Banka ${fmt(kasaBakiye('banka'))} · Kasa ${fmt(kasaBakiye('kasa'))}</div></div>
  <div class="tile"><div class="lbl">Stok değeri (maliyet)</div><div class="val num">${fmt(stokDeger())}</div><div class="cap">${DB.urun.length} ürün · ${dusuk.length} düşük stok</div></div>
  <div class="tile"><div class="lbl">Bu ay satış</div><div class="val num">${fmt(satisAy)}</div><div class="cap">Tahsilat ${fmt(tahAy)}</div></div>
  <div class="tile"><div class="lbl">Aylık depo kirası</div><div class="val num">${fmt(DB.depo.reduce((a,d)=>a+ +d.aylikKira,0))}</div><div class="cap">${DB.depo.length} depo · ${kiraAcik.length} ödenmemiş dönem</div></div>
 </div>
 <div class="grid2">
  <div class="card"><header><h2>Uyarılar</h2><span class="pill ${uyari.length?'warn':'good'}">${uyari.length}</span></header><div class="body">${uyari.length?`<ul style="margin:0;padding-left:18px">${uyari.map(u=>`<li>${esc(u)}</li>`).join('')}</ul>`:'<span class="note">Bekleyen uyarı yok.</span>'}</div></div>
  <div class="card"><header><h2>Son 6 ay · satış ve tahsilat</h2><span class="note"><span class="pill acc">satış</span> <span class="pill good">tahsilat</span></span></header><div class="body"><div class="bars">${months.map(m=>`<div class="b" title="${m.l}: satış ${fmt(m.s)}, tahsilat ${fmt(m.th)}"><div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:100px"><i style="height:${Math.round(m.s/mx*100)}%"></i><i class="alt" style="height:${Math.round(m.th/mx*100)}%"></i></div><small>${m.l}</small></div>`).join('')}</div></div></div>
 </div>
 <div class="card"><header><h2>Son hareketler</h2></header>${tbl([{h:'Tarih',f:r=>dstr(r.t)},{h:'Tür',f:r=>r.tip},{h:'Ref',f:r=>esc(r.ref)},{h:'Cari / açıklama',f:r=>esc(r.k),wrap:1},{h:'Tutar',r:1,f:r=>`<span style="color:${r.v<0?'var(--bad)':'var(--good)'}">${fmt(r.v)}</span>`}],son,{onRow:r=>r.go})}</div>`);
}

/* ===================== CARİLER ===================== */
let cariFiltre={q:'',tip:''};
function vCari(){
 if(PARAM) return vCariDetay(PARAM);
 const rows=DB.cari.filter(c=>(!cariFiltre.tip||c.tip===cariFiltre.tip)&&(!cariFiltre.q||(c.ad+' '+c.sehir+' '+(c.pib||'')).toLowerCase().includes(cariFiltre.q.toLowerCase()))).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
 return page('Cariler','Müşteriler ve tedarikçiler, güncel bakiyeleriyle',`<button class="btn pri" onclick="editCari()">+ Yeni cari</button>`,`
 <div class="card"><header><div class="search"><input id="cq" placeholder="Ara: ad, şehir, PIB" value="${esc(cariFiltre.q)}" oninput="cariFiltre.q=this.value;render();document.getElementById('cq').focus();document.getElementById('cq').setSelectionRange(99,99)" style="width:240px">${sel('ctip',[{v:'',t:'Tümü'},{v:'musteri',t:'Müşteriler'},{v:'tedarikci',t:'Tedarikçiler'}],cariFiltre.tip,`onchange="cariFiltre.tip=this.value;render()" style="width:150px"`)}</div><span class="note">${rows.length} kayıt</span></header>
 ${tbl([{h:'Ad',f:c=>`<b>${esc(c.ad)}</b>`},{h:'Tür',f:c=>c.tip==='musteri'?'<span class="pill acc">Müşteri</span>':'<span class="pill">Tedarikçi</span>'},{h:'Şehir',f:c=>esc(c.sehir)+(c.ulke?', '+esc(c.ulke):'')},{h:'PIB / VKN',f:c=>esc(c.pib||'—')},{h:'Vade',r:1,f:c=>(c.vade||0)+' gün'},{h:'Bakiye',r:1,f:c=>pillBakiye(cariBakiye(c.id))}],rows,{onRow:c=>`go('cari','${c.id}')`})}</div>`);
}
function vCariDetay(id){
 const c=cariById(id); if(!c) return vCari();
 const belgeler=(c.tip==='musteri'?DB.satis:DB.alis).filter(b=>b.cariId===id);
 const odemeler=DB.kasa.filter(k=>k.cariId===id);
 let bak=0;
 const ekstre=[...belgeler.map(b=>({t:b.tarih,a:(c.tip==='musteri'?'Satış ':'Alış ')+b.no,borc:belgeToplam(b),alacak:0})),...odemeler.map(k=>({t:k.tarih,a:(k.tip==='tahsilat'?'Tahsilat':'Ödeme')+' · '+(k.hesap==='banka'?'Banka':'Kasa')+(k.aciklama?' · '+k.aciklama:''),borc:0,alacak:+k.tutar}))].sort((a,b)=>a.t.localeCompare(b.t)).map(r=>{ bak+=r.borc-r.alacak; return {...r,bak}; });
 return page(esc(c.ad),`${c.tip==='musteri'?'Müşteri':'Tedarikçi'} · ${esc(c.sehir||'')} ${esc(c.ulke||'')}`,`<button class="btn" onclick="go('cari')">← Liste</button><button class="btn" onclick="editCari('${id}')">Düzenle</button>${c.tip==='musteri'?`<button class="btn pri" onclick="editSatis(null,'${id}')">+ Satış</button><button class="btn" onclick="editKasa('tahsilat','${id}')">+ Tahsilat</button>`:`<button class="btn pri" onclick="editAlis(null,'${id}')">+ Alış</button><button class="btn" onclick="editKasa('odeme','${id}')">+ Ödeme</button>`}<button class="btn danger" onclick="delCari('${id}')">Sil</button>`,`
 <div class="tiles"><div class="tile ${cariBakiye(id)>0?'bad':'good'}"><div class="lbl">Bakiye</div><div class="val num">${fmt(cariBakiye(id))}</div></div><div class="tile"><div class="lbl">Toplam ${c.tip==='musteri'?'satış':'alış'}</div><div class="val num">${fmt(belgeler.reduce((a,b)=>a+belgeToplam(b),0))}</div></div><div class="tile"><div class="lbl">Toplam ${c.tip==='musteri'?'tahsilat':'ödeme'}</div><div class="val num">${fmt(odemeler.reduce((a,k)=>a+ +k.tutar,0))}</div></div></div>
 <div class="grid2"><div class="card"><header><h2>Bilgiler</h2></header><div class="body"><dl class="kv"><dt>Adres</dt><dd>${esc(c.adres||'—')}</dd><dt>Telefon</dt><dd>${esc(c.tel||'—')}</dd><dt>E-posta</dt><dd>${esc(c.email||'—')}</dd><dt>PIB / VKN</dt><dd>${esc(c.pib||'—')}</dd><dt>Vade</dt><dd>${c.vade||0} gün</dd><dt>Notlar</dt><dd>${esc(c.notlar||'—')}</dd></dl></div></div>
 <div class="card"><header><h2>Cari ekstre</h2></header>${tbl([{h:'Tarih',f:r=>dstr(r.t)},{h:'Açıklama',f:r=>esc(r.a),wrap:1},{h:'Borç',r:1,f:r=>r.borc?fmt(r.borc):''},{h:'Alacak',r:1,f:r=>r.alacak?fmt(r.alacak):''},{h:'Bakiye',r:1,f:r=>fmt(r.bak)}],ekstre)}</div></div>`);
}
function editCari(id){
 const c=id?cariById(id):{tip:'musteri',ulke:'Srbija',vade:30};
 modal(id?'Cariyi düzenle':'Yeni cari',
  fld('Ad / Firma',inp('ad',c.ad),0,1)+fld('Tür',sel('tip',[{v:'musteri',t:'Müşteri'},{v:'tedarikci',t:'Tedarikçi'}],c.tip))+fld('Adres',inp('adres',c.adres),1)+fld('Şehir',inp('sehir',c.sehir))+fld('Ülke',inp('ulke',c.ulke))+fld('Telefon',inp('tel',c.tel))+fld('E-posta',inp('email',c.email,'email'))+fld('PIB / VKN',inp('pib',c.pib))+fld('Vade (gün)',inp('vade',c.vade,'number'))+fld('Notlar',`<textarea name="notlar">${esc(c.notlar||'')}</textarea>`,1),
  d=>{ if(!req(d,['ad'])) return false; d.vade=+d.vade||0; if(id) Object.assign(c,d); else DB.cari.push({id:uid(),...d}); toast('Cari kaydedildi'); });
}
function delCari(id){ confirmDel('Bu cari ve ona bağlı belge/ödeme kayıtlarının <b>tamamı</b> silinecek. Devam edilsin mi?',()=>{ DB.cari=DB.cari.filter(c=>c.id!==id); DB.satis=DB.satis.filter(s=>s.cariId!==id); DB.alis=DB.alis.filter(s=>s.cariId!==id); DB.kasa=DB.kasa.filter(k=>k.cariId!==id); PARAM=null; }); }

/* ===================== SATIŞ / ALIŞ ===================== */
function vBelge(tip){
 const satis=tip==='satis'; const list=(satis?DB.satis:DB.alis).slice().sort((a,b)=>b.tarih.localeCompare(a.tarih));
 const t=today();
 const top=list.reduce((a,b)=>a+belgeToplam(b),0);
 return page(satis?'Satış / Giden Mal':'Alış / Gelen Mal',satis?'Müşteriye kesilen satış belgeleri; stoktan düşer, cariye borç yazar':'Tedarikçiden gelen mal; stoğa girer, tedarikçiye borç yazar',`<button class="btn pri" onclick="${satis?'editSatis()':'editAlis()'}">+ Yeni ${satis?'satış':'alış'}</button>`,`
 <div class="tiles"><div class="tile"><div class="lbl">Toplam ${satis?'satış':'alış'}</div><div class="val num">${fmt(top)}</div><div class="cap">${list.length} belge</div></div><div class="tile"><div class="lbl">Bu ay</div><div class="val num">${fmt(list.filter(b=>ym(b.tarih)===ym(t)).reduce((a,b)=>a+belgeToplam(b),0))}</div></div><div class="tile ${satis&&vadesiGecen().length?'bad':''}"><div class="lbl">Vadesi geçen</div><div class="val num">${list.filter(b=>b.vade&&b.vade<t&&cariBakiye(b.cariId)>0).length}</div><div class="cap">açık bakiyeli belge</div></div></div>
 <div class="card">${tbl([{h:'No',f:b=>`<b>${esc(b.no)}</b>`},{h:'Tarih',f:b=>dstr(b.tarih)},{h:satis?'Müşteri':'Tedarikçi',f:b=>esc(cariAd(b.cariId))},{h:'Kalem',f:b=>b.kalemler.map(k=>`${esc(k.urunId==='_hizmet'?k.ad:(urunById(k.urunId)?.ad||'?'))} × ${fmtQ(k.miktar)}`).join('<br>'),wrap:1},{h:'Ara toplam',r:1,f:b=>fmt(belgeAra(b))},{h:'KDV',r:1,f:b=>(b.kdv||0)+'%'},{h:'Toplam',r:1,f:b=>`<b>${fmt(belgeToplam(b))}</b>`},{h:'Vade',f:b=>b.vade?`<span class="pill ${b.vade<t&&cariBakiye(b.cariId)>0?'bad':''}">${dstr(b.vade)}</span>`:'—'},{h:'',f:b=>`<button class="btn sm" onclick="event.stopPropagation();${satis?'editSatis':'editAlis'}('${b.id}')">Düzenle</button> <button class="btn sm danger" onclick="event.stopPropagation();delBelge('${tip}','${b.id}')">Sil</button>`}],list,{onRow:b=>`go('cari','${b.cariId}')`})}</div>`);
}
function lineRows(kalemler,alis){
 const opts=[{v:'',t:'— ürün seç —'},...DB.urun.map(u=>({v:u.id,t:`${u.kod} · ${u.ad}`})),{v:'_hizmet',t:'Hizmet / diğer (serbest)'}];
 return kalemler.map((k,i)=>`<tr data-i="${i}"><td style="min-width:240px">${sel('urun'+i,opts,k.urunId,`onchange="lineUrun(this,${alis})"`)}<input name="ad${i}" placeholder="Açıklama" value="${esc(k.ad||'')}" style="margin-top:4px;${k.urunId==='_hizmet'?'':'display:none'}"></td><td><input name="miktar${i}" type="number" step="any" value="${k.miktar??''}" oninput="lineTotal()" style="width:100px"></td><td><input name="fiyat${i}" type="number" step="0.01" value="${k.fiyat??''}" oninput="lineTotal()" style="width:110px"></td><td class="r num" id="lt${i}">${fmt(n2((k.miktar||0)*(k.fiyat||0)))}</td><td><button type="button" class="btn sm" onclick="lineDel(${i})">×</button></td></tr>`).join('');
}
function lineUrun(s,alis){ const i=s.closest('tr').dataset.i; const u=urunById(s.value); const f=document.querySelector(`[name=fiyat${i}]`); const ad=document.querySelector(`[name=ad${i}]`); ad.style.display=s.value==='_hizmet'?'':'none'; if(u&&f&&!f.value) f.value=alis?u.alisFiyat:u.satisFiyat; lineTotal(); }
function lineTotal(){ let s=0; document.querySelectorAll('#lines tr[data-i]').forEach(tr=>{ const i=tr.dataset.i; const v=n2((+document.querySelector(`[name=miktar${i}]`).value||0)*(+document.querySelector(`[name=fiyat${i}]`).value||0)); s+=v; document.getElementById('lt'+i).textContent=fmt(v); }); const kdv=+document.querySelector('[name=kdv]').value||0; document.getElementById('ltAra').textContent=fmt(s); document.getElementById('ltKdv').textContent=fmt(n2(s*kdv/100)); document.getElementById('ltTop').textContent=fmt(n2(s*(1+kdv/100))); }
function lineAdd(alis){ const tb=document.getElementById('lines'); const i=tb.querySelectorAll('tr[data-i]').length; tb.insertAdjacentHTML('beforeend',lineRows([{miktar:'',fiyat:''}],alis).replace(/data-i="0"/,`data-i="${i}"`).replace(/urun0|ad0|miktar0|fiyat0|lt0|lineDel\(0\)/g,m=>m.replace('0',i))); }
function lineDel(i){ const tr=document.querySelector(`#lines tr[data-i="${i}"]`); if(tr) tr.remove(); lineTotal(); }
function readLines(){ const out=[]; document.querySelectorAll('#lines tr[data-i]').forEach(tr=>{ const i=tr.dataset.i; const urunId=document.querySelector(`[name=urun${i}]`).value; const miktar=+document.querySelector(`[name=miktar${i}]`).value; const fiyat=+document.querySelector(`[name=fiyat${i}]`).value; const ad=document.querySelector(`[name=ad${i}]`).value; if(urunId&&miktar) out.push(urunId==='_hizmet'?{urunId,ad:ad||'Hizmet',miktar,fiyat}:{urunId,miktar,fiyat}); }); return out; }
function belgeForm(b,cariTip,alis){
 const caris=DB.cari.filter(c=>c.tip===cariTip).sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(c=>({v:c.id,t:c.ad}));
 return fld('Belge no',inp('no',b.no))+fld('Tarih',inp('tarih',b.tarih,'date'),0,1)+fld(cariTip==='musteri'?'Müşteri':'Tedarikçi',sel('cariId',[{v:'',t:'— seç —'},...caris],b.cariId,`onchange="vadeHesapla(this.value)"`),0,1)+fld('Vade tarihi',inp('vade',b.vade,'date'))+fld('KDV (PDV) %',inp('kdv',b.kdv??DB.ayar.kdv,'number','oninput="lineTotal()"'))+fld('Not',inp('not',b.not))+
 `<div class="lines"><table><thead><tr><th>Ürün</th><th>Miktar</th><th>Birim fiyat</th><th class="r">Tutar</th><th></th></tr></thead><tbody id="lines">${lineRows(b.kalemler,alis)}</tbody><tfoot><tr><td colspan="5"><button type="button" class="btn sm" onclick="lineAdd(${alis})">+ Kalem ekle</button></td></tr><tr><td colspan="3" class="r">Ara toplam</td><td class="r num" id="ltAra"></td><td></td></tr><tr><td colspan="3" class="r">KDV</td><td class="r num" id="ltKdv"></td><td></td></tr><tr><td colspan="3" class="r"><b>Genel toplam</b></td><td class="r num" id="ltTop"><b></b></td><td></td></tr></tfoot></table></div>`;
}
function vadeHesapla(cid){ const c=cariById(cid); const t=document.querySelector('[name=tarih]').value; const v=document.querySelector('[name=vade]'); if(c&&t&&!v.value) v.value=addDays(t,c.vade||0); }
function editSatis(id,cariId){
 const b=id?DB.satis.find(s=>s.id===id):{no:'',tarih:today(),cariId:cariId||'',kalemler:[{miktar:'',fiyat:''}],kdv:DB.ayar.kdv,vade:cariId?addDays(today(),cariById(cariId)?.vade||0):'',not:''};
 modal(id?'Satışı düzenle':'Yeni satış · giden mal',belgeForm(b,'musteri',false),d=>{ const kal=readLines(); if(!req(d,['tarih','cariId'])) return false; if(!kal.length){ toast('En az bir kalem girin'); return false; } for(const k of kal){ if(k.urunId!=='_hizmet'&&!id&&stokMiktar(k.urunId)<k.miktar) toast(`Uyarı: ${urunById(k.urunId).ad} stoğu yetersiz (${fmtQ(stokMiktar(k.urunId))})`); } const rec={no:d.no||nextNo('satis'),tarih:d.tarih,cariId:d.cariId,kalemler:kal,kdv:+d.kdv||0,vade:d.vade,not:d.not}; if(id) Object.assign(b,rec); else DB.satis.push({id:uid(),...rec}); toast('Satış kaydedildi'); });
 lineTotal();
}
function editAlis(id,cariId){
 const b=id?DB.alis.find(s=>s.id===id):{no:'',tarih:today(),cariId:cariId||'',kalemler:[{miktar:'',fiyat:''}],kdv:DB.ayar.kdv,vade:'',not:''};
 modal(id?'Alışı düzenle':'Yeni alış · gelen mal',belgeForm(b,'tedarikci',true),d=>{ const kal=readLines(); if(!req(d,['tarih','cariId'])) return false; if(!kal.length){ toast('En az bir kalem girin'); return false; } const rec={no:d.no||nextNo('alis'),tarih:d.tarih,cariId:d.cariId,kalemler:kal,kdv:+d.kdv||0,vade:d.vade,not:d.not}; if(id) Object.assign(b,rec); else DB.alis.push({id:uid(),...rec}); toast('Alış kaydedildi'); });

function delBelge(tip,id){ confirmDel('Belge silinecek; stok ve cari bakiye yeniden hesaplanır.',()=>{ if(tip==='satis') DB.satis=DB.satis.filter(s=>s.id!==id); else DB.alis=DB.alis.filter(s=>s.id!==id); }); }

let kasaFiltre='';
function vKasa(){
 const list=DB.kasa.filter(k=>!kasaFiltre||k.tip===kasaFiltre).slice().sort((a,b)=>b.tarih.localeCompare(a.tarih));
 const bu=ym(today());
 const gider=DB.kasa.filter(k=>k.tip==='gider'&&ym(k.tarih)===bu).reduce((a,k)=>a+ +k.tutar,0);
 const katlar={}; DB.kasa.filter(k=>k.tip==='gider').forEach(k=>{ katlar[k.kategori||'Diğer']=(katlar[k.kategori||'Diğer']||0)+ +k.tutar; });

 <div class="tiles"><div class="tile good"><div class="lbl">Banka</div><div class="val num">${fmt(kasaBakiye('banka'))}</div></div><div class="tile good"><div class="lbl">Nakit kasa</div><div class="val num">${fmt(kasaBakiye('kasa'))}</div></div><div class="tile"><div class="lbl">Bu ay tahsilat</div><div class="val num">${fmt(DB.kasa.filter(k=>k.tip==='tahsilat'&&ym(k.tarih)===bu).reduce((a,k)=>a+ +k.tutar,0))}</div></div><div class="tile warn"><div class="lbl">Bu ay gider</div><div class="val num">${fmt(gider)}</div></div></div>
 <div class="grid2" style="grid-template-columns:2fr 1fr"><div class="card"><header><div class="search">${sel('kf',[{v:'',t:'Tüm hareketler'},{v:'tahsilat',t:'Tahsilatlar'},{v:'odeme',t:'Tedarikçi ödemeleri'},{v:'gider',t:'Giderler'}],kasaFiltre,`onchange="kasaFiltre=this.value;render()" style="width:200px"`)}</div></header>
 ${tbl([{h:'Tarih',f:k=>dstr(k.tarih)},{h:'Tür',f:k=>k.tip==='tahsilat'?'<span class="pill good">Tahsilat</span>':k.tip==='odeme'?'<span class="pill warn">Ödeme</span>':'<span class="pill bad">Gider</span>'},{h:'Cari / kategori',f:k=>esc(k.cariId?cariAd(k.cariId):(k.kategori||'—'))},{h:'Açıklama',f:k=>esc(k.aciklama||''),wrap:1},{h:'Hesap',f:k=>k.hesap==='banka'?'Banka':'Kasa'},{h:'Tutar',r:1,f:k=>`<span style="color:${k.tip==='tahsilat'?'var(--good)':'var(--bad)'}">${k.tip==='tahsilat'?'+':'−'}${fmt(k.tutar)}</span>`},{h:'',f:k=>`<button class="btn sm" onclick="editKasa('${k.tip}',null,'${k.id}')">Düzenle</button> <button class="btn sm danger" onclick="delKasa('${k.id}')">Sil</button>`}],list)}</div>
 <div class="card"><header><h2>Gider kategorileri</h2></header>${tbl([{h:'Kategori',f:r=>esc(r[0])},{h:'Toplam',r:1,f:r=>fmt(r[1])}],Object.entries(katlar).sort((a,b)=>b[1]-a[1]),{empty:'Gider yok'})}</div></div>`);
}
function editKasa(tip,cariId,id){
 const k=id?DB.kasa.find(x=>x.id===id):{tip,tarih:today(),cariId:cariId||'',tutar:'',hesap:'banka',aciklama:'',kategori:''};
 tip=k.tip;
 const caris=DB.cari.filter(c=>c.tip===(tip==='tahsilat'?'musteri':'tedarikci')).sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(c=>({v:c.id,t:`${c.ad} (bakiye ${fmt(cariBakiye(c.id))})`}));
 const ttl={tahsilat:'Tahsilat',odeme:'Tedarikçi ödemesi',gider:'Gider'}[tip];
 modal((id?'Düzenle: ':'Yeni ')+ttl,
  fld('Tarih',inp('tarih',k.tarih,'date'),0,1)+(tip==='gider'?fld('Kategori',sel('kategori',['Depo kirası','Araç','Personel','Vergi & harç','Nakliye','Ofis','Banka masrafı','Diğer'].map(x=>({v:x,t:x})),k.kategori||'Diğer')):fld(tip==='tahsilat'?'Müşteri':'Tedarikçi',sel('cariId',[{v:'',t:'— seç —'},...caris],k.cariId),0,1))+fld('Tutar ('+DB.ayar.paraBirimi+')',inp('tutar',k.tutar,'number','step="0.01"'),0,1)+fld('Hesap',sel('hesap',[{v:'banka',t:'Banka'},{v:'kasa',t:'Nakit kasa'}],k.hesap))+fld('Açıklama',inp('aciklama',k.aciklama),1),
  d=>{ if(!req(d,['tarih','tutar'])||(tip!=='gider'&&!req(d,['cariId']))) return false; const rec={tip,tarih:d.tarih,cariId:tip==='gider'?'':d.cariId,kategori:d.kategori||'',tutar:n2(d.tutar),hesap:d.hesap,aciklama:d.aciklama}; if(id) Object.assign(k,rec); else DB.kasa.push({id:uid(),...rec}); toast(ttl+' kaydedildi'); });
}
function delKasa(id){ confirmDel('Kasa hareketi silinecek.',()=>{ DB.kasa=DB.kasa.filter(k=>k.id!==id); }); }

/* ===================== STOK ===================== */
let stokQ='';
function vStok(){
 const rows=DB.urun.filter(u=>!stokQ||(u.kod+' '+u.ad+' '+u.kategori).toLowerCase().includes(stokQ.toLowerCase()));
 const hareket=[];
 DB.alis.forEach(a=>a.kalemler.forEach(k=>{ if(k.urunId!=='_hizmet') hareket.push({t:a.tarih,tip:'Giriş',ref:a.no,kim:cariAd(a.cariId),u:urunById(k.urunId)?.ad,q:+k.miktar}); }));
 DB.satis.forEach(s=>s.kalemler.forEach(k=>{ if(k.urunId!=='_hizmet') hareket.push({t:s.tarih,tip:'Çıkış',ref:s.no,kim:cariAd(s.cariId),u:urunById(k.urunId)?.ad,q:-k.miktar}); }));
 DB.stokHareket.forEach(h=>hareket.push({t:h.tarih,tip:h.miktar>=0?'Düzeltme +':'Düzeltme −',ref:'Sayım',kim:h.aciklama,u:urunById(h.urunId)?.ad,q:+h.miktar,id:h.id}));
 hareket.sort((a,b)=>b.t.localeCompare(a.t));
 return page('Stok','Depo bazında ürün miktarları ve hareketler',`<button class="btn pri" onclick="editUrun()">+ Yeni ürün</button><button class="btn" onclick="editSayim()">Sayım / düzeltme</button>`,`
 <div class="tiles"><div class="tile"><div class="lbl">Stok değeri (maliyet)</div><div class="val num">${fmt(stokDeger())}</div></div><div class="tile"><div class="lbl">Satış değeri</div><div class="val num">${fmt(DB.urun.reduce((a,u)=>a+stokMiktar(u.id)*(+u.satisFiyat||0),0))}</div></div><div class="tile ${DB.urun.some(dusukStok)?'warn':''}"><div class="lbl">Düşük stok</div><div class="val num">${DB.urun.filter(dusukStok).length}</div><div class="cap">hareket görmüş ürünlerde, min. seviyenin altında</div></div></div>
 <div class="card"><header><div class="search"><input id="sq" placeholder="Ara: kod, ad, kategori" value="${esc(stokQ)}" oninput="stokQ=this.value;render();document.getElementById('sq').focus();document.getElementById('sq').setSelectionRange(99,99)" style="width:240px"></div></header>
 ${tbl([{h:'',f:u=>urunImg(u,'thumb')},{h:'Kod',f:u=>`<b>${esc(u.kod)}</b>`},{h:'Ürün',f:u=>esc(u.ad),wrap:1},{h:'Kategori',f:u=>esc(u.kategori||'')},{h:'Depo',f:u=>esc(DB.depo.find(d=>d.id===u.depoId)?.ad||'—')},{h:'Mevcut',r:1,f:u=>{const q=stokMiktar(u.id);return `<b style="color:${q<u.minStok?'var(--bad)':'inherit'}">${fmtQ(q)}</b> ${u.birim}`}},{h:'Min',r:1,f:u=>fmtQ(u.minStok)},{h:'Maliyet',r:1,f:u=>fmt(u.alisFiyat)},{h:'Stok değeri',r:1,f:u=>fmt(stokMiktar(u.id)*u.alisFiyat)},{h:'',f:u=>`<button class="btn sm" onclick="editUrun('${u.id}')">Düzenle</button> <button class="btn sm danger" onclick="delUrun('${u.id}')">Sil</button>`}],rows)}</div>
 <div class="card"><header><h2>Stok hareketleri</h2></header>${tbl([{h:'Tarih',f:h=>dstr(h.t)},{h:'Tür',f:h=>h.q>=0?`<span class="pill good">${h.tip}</span>`:`<span class="pill warn">${h.tip}</span>`},{h:'Ref',f:h=>esc(h.ref)},{h:'Ürün',f:h=>esc(h.u||'?'),wrap:1},{h:'Cari / açıklama',f:h=>esc(h.kim||''),wrap:1},{h:'Miktar',r:1,f:h=>(h.q>=0?'+':'')+fmtQ(h.q)},{h:'',f:h=>h.id?`<button class="btn sm danger" onclick="DB.stokHareket=DB.stokHareket.filter(x=>x.id!=='${h.id}');save();render()">Sil</button>`:''}],hareket.slice(0,60))}</div>`);
}
let RESIM_TMP=null;
function urunForm(u){ const kats=[...new Set([...Object.keys(RESIM),...DB.urun.map(x=>x.kategori)].filter(Boolean))]; return fld('Kod',inp('kod',u.kod),0,1)+fld('Ürün adı',inp('ad',u.ad),0,1)+fld('Ürün grubu (yazarak yeni grup da ekleyebilirsiniz)',inp('kategori',u.kategori,'text','list="katlist"')+`<datalist id="katlist">${kats.map(k=>`<option value="${esc(k)}">`).join('')}</datalist>`)+fld('Birim',sel('birim',['m²','m','kg','ton','rulo','adet','palet'].map(x=>({v:x,t:x})),u.birim))+fld('Teknik özet (fiyat listesinde görünür)',inp('spec',u.spec),1)+fld('Alış / maliyet fiyatı',inp('alisFiyat',u.alisFiyat,'number','step="0.01"'))+fld('Satış liste fiyatı',inp('satisFiyat',u.satisFiyat,'number','step="0.01"'))+fld('KDV %',inp('kdv',u.kdv??DB.ayar.kdv,'number'))+fld('Min. stok',inp('minStok',u.minStok,'number'))+fld('Depo',sel('depoId',[{v:'',t:'—'},...DB.depo.map(d=>({v:d.id,t:d.ad}))],u.depoId))+fld('Fotoğraf adresi (URL)',inp('resim',u.resim&&!u.resim.startsWith('data:')?u.resim:'','url','placeholder="Boş bırakılırsa ürün grubunun fotoğrafı (geoser.com.tr) kullanılır"'),1)+fld('Veya fotoğraf yükle',`<input type="file" accept="image/*" onchange="resimYukle(this)"><span class="note" id="resimNot">${u.resim&&u.resim.startsWith('data:')?'Yüklü fotoğraf kullanılıyor':''}</span>`,1); }
function resimYukle(inp_){ const f=inp_.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,640/im.width); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); RESIM_TMP=c.toDataURL('image/jpeg',.82); document.getElementById('resimNot').textContent='Fotoğraf hazır ('+Math.round(RESIM_TMP.length/1024)+' KB) — Kaydet ile saklanır'; }; im.src=e.target.result; }; r.readAsDataURL(f); }
function editUrun(id){ RESIM_TMP=null; const u=id?urunById(id):{birim:'m²',kdv:DB.ayar.kdv,minStok:0}; modal(id?'Ürünü düzenle':'Yeni ürün',urunForm(u),d=>{ if(!req(d,['kod','ad'])) return false; ['alisFiyat','satisFiyat','kdv','minStok'].forEach(k=>d[k]=+d[k]||0); if(RESIM_TMP) d.resim=RESIM_TMP; else if(!d.resim&&u.resim&&u.resim.startsWith('data:')) d.resim=u.resim; if(id) Object.assign(u,d); else DB.urun.push({id:uid(),...d}); toast('Ürün kaydedildi'); }); }
function delUrun(id){ confirmDel('Ürün silinecek. Belgelerde geçen kalemler "?" olarak görünür.',()=>{ DB.urun=DB.urun.filter(u=>u.id!==id); }); }
function editSayim(){ modal('Stok sayımı / düzeltme',fld('Ürün',sel('urunId',[{v:'',t:'— seç —'},...DB.urun.map(u=>({v:u.id,t:`${u.kod} · ${u.ad} (mevcut ${fmtQ(stokMiktar(u.id))})`}))],''),0,1)+fld('Tarih',inp('tarih',today(),'date'))+fld('Miktar (+ giriş / − çıkış)',inp('miktar','','number','step="any"'),0,1)+fld('Açıklama',inp('aciklama','Sayım farkı'),1),d=>{ if(!req(d,['urunId','miktar'])) return false; DB.stokHareket.push({id:uid(),urunId:d.urunId,tarih:d.tarih,miktar:+d.miktar,aciklama:d.aciklama}); toast('Düzeltme kaydedildi'); }); }

let fiyatGorunum='grid', fiyatKat='';
function vFiyat(){
 const katlar=[...new Set(DB.urun.map(u=>u.kategori).filter(Boolean))];
 const rows=DB.urun.filter(u=>!fiyatKat||u.kategori===fiyatKat).sort((a,b)=>(a.kategori||'').localeCompare(b.kategori||'')||a.kod.localeCompare(b.kod));
 const filtre=`<div class="search" style="margin-bottom:14px"><span class="seg"><button class="${fiyatGorunum==='grid'?'on':''}" onclick="fiyatGorunum='grid';render()">Görselli</button><button class="${fiyatGorunum==='table'?'on':''}" onclick="fiyatGorunum='table';render()">Tablo</button></span>${sel('fk',[{v:'',t:'Tüm kategoriler'},...katlar.map(k=>({v:k,t:k}))],fiyatKat,`onchange="fiyatKat=this.value;render()" style="width:200px"`)}<span class="note">${rows.length} ürün</span></div>`;
 const kart=u=>`<div class="pcard"><div class="ph">${urunImg(u)}</div><div class="pb"><span class="kod">${esc(u.kod)}</span><span class="ad">${esc(u.ad)}</span><span class="spec">${esc(u.spec||'')}</span><div class="pr"><div><b>${fmt(u.satisFiyat)}</b> <small>/ ${u.birim}</small></div><small>KDV dahil ${fmt(u.satisFiyat*(1+(u.kdv||0)/100))}</small></div><div class="actions" style="margin-top:6px"><button class="btn sm" onclick="editUrun('${u.id}')">Düzenle</button><span class="note" style="align-self:center">stok ${fmtQ(stokMiktar(u.id))} ${u.birim}</span></div></div></div>`;
 const gruplar=[...KATALOG.map(k=>k.ad),...katlar.filter(k=>!RESIM[k])].filter(k=>rows.some(u=>u.kategori===k));
 const grid=gruplar.map(g=>{ const kk=KATALOG.find(k=>k.ad===g)||{ad:g,ozet:'',cesitler:[]}; const us=rows.filter(u=>u.kategori===g); return `<section class="kgrp"><div class="kban">${urunImg({kategori:g,ad:g})}<div class="kinfo"><h2>${esc(g)}</h2><p>${esc(kk.ozet||'')}</p>${kk.cesitler.length?`<div class="cs">${kk.cesitler.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div>`:''}<span class="note">${us.length} kalem</span></div></div><div class="pgrid">${us.map(kart).join('')}</div></section>`; }).join('');
 return page('Fiyat Listesi',`${DB.ayar.firma} · geçerli ${dstr(today())} · fiyatlar ${DB.ayar.paraBirimi}, KDV hariç`,`<button class="btn" onclick="editUrun()">+ Ürün</button><button class="btn" onclick="toplucZam()">Toplu fiyat güncelle</button><button class="btn pri" onclick="copyFiyat()">Listeyi kopyala</button>`,filtre+(fiyatGorunum==='grid'?grid:`
 <div class="card">${tbl([{h:'',f:u=>urunImg(u,'thumb')},{h:'Kod',f:u=>`<b>${esc(u.kod)}</b>`},{h:'Ürün',f:u=>esc(u.ad)+(u.spec?`<br><span class="note">${esc(u.spec)}</span>`:''),wrap:1},{h:'Kategori',f:u=>esc(u.kategori||'')},{h:'Birim',f:u=>u.birim},{h:'Maliyet',r:1,f:u=>fmt(u.alisFiyat)},{h:'Liste fiyatı',r:1,f:u=>`<b>${fmt(u.satisFiyat)}</b>`},{h:'Marj',r:1,f:u=>{const m=u.satisFiyat?(u.satisFiyat-u.alisFiyat)/u.satisFiyat*100:0;return `<span class="pill ${m<15?'bad':m<25?'warn':'good'}">%${m.toFixed(1)}</span>`}},{h:'KDV dahil',r:1,f:u=>fmt(u.satisFiyat*(1+(u.kdv||0)/100))},{h:'',f:u=>`<button class="btn sm" onclick="editUrun('${u.id}')">Düzenle</button>`}],rows)}</div>
 <p class="note">Marj = (liste fiyatı − maliyet) / liste fiyatı. Kırmızı: %15 altı, sarı: %25 altı.</p>`));
}
function toplucZam(){ modal('Toplu fiyat güncelle',fld('Kategori',sel('kat',[{v:'',t:'Tüm ürünler'},...[...new Set(DB.urun.map(u=>u.kategori).filter(Boolean))].map(k=>({v:k,t:k}))],''))+fld('Alan',sel('alan',[{v:'satisFiyat',t:'Satış liste fiyatı'},{v:'alisFiyat',t:'Maliyet'}],'satisFiyat'))+fld('Değişim % (örn. 5 veya -3)',inp('yuzde','','number','step="0.1"'),0,1),d=>{ const y=+d.yuzde; if(!y){ toast('Yüzde girin'); return false; } let n=0; DB.urun.forEach(u=>{ if(!d.kat||u.kategori===d.kat){ u[d.alan]=n2(u[d.alan]*(1+y/100)); n++; } }); toast(n+' ürün güncellendi'); },'Uygula'); }
function copyFiyat(){ const txt=['Kod\tÜrün\tBirim\tFiyat ('+DB.ayar.paraBirimi+', KDV hariç)',...DB.urun.map(u=>`${u.kod}\t${u.ad}\t${u.birim}\t${(+u.satisFiyat).toFixed(2)}`)].join('\n'); navigator.clipboard.writeText(txt).then(()=>toast('Fiyat listesi panoya kopyalandı (Excel\'e yapıştırabilirsiniz)')).catch(()=>toast('Kopyalanamadı')); }

 <div class="tiles"><div class="tile"><div class="lbl">Araç sayısı</div><div class="val num">${DB.arac.length}</div></div><div class="tile warn"><div class="lbl">Bu ay araç gideri</div><div class="val num">${fmt(list.filter(g=>ym(g.tarih)===bu).reduce((a,g)=>a+ +g.tutar,0))}</div></div><div class="tile"><div class="lbl">Toplam araç gideri</div><div class="val num">${fmt(list.reduce((a,g)=>a+ +g.tutar,0))}</div></div></div>

 const urunS={}; DB.satis.filter(s=>s.tarih.startsWith(y)).forEach(s=>s.kalemler.forEach(k=>{ if(k.urunId!=='_hizmet'){ urunS[k.urunId]=urunS[k.urunId]||{q:0,v:0}; urunS[k.urunId].q+= +k.miktar; urunS[k.urunId].v+=n2(k.miktar*k.fiyat); } }));

 const yas=DB.cari.filter(c=>c.tip==='musteri'&&cariBakiye(c.id)>0).map(c=>{ const t=today(); const b={c,k0:0,k30:0,k60:0,k90:0}; DB.satis.filter(s=>s.cariId===c.id).forEach(s=>{ const g=s.vade?Math.floor((new Date(t)-new Date(s.vade))/864e5):0; const v=belgeToplam(s); if(g<=0) b.k0+=v; else if(g<=30) b.k30+=v; else if(g<=60) b.k60+=v; else b.k90+=v; }); return b; });

 <div class="tiles"><div class="tile"><div class="lbl">${y} satış (KDV hariç)</div><div class="val num">${fmt(tS)}</div></div><div class="tile"><div class="lbl">Satılan mal maliyeti</div><div class="val num">${fmt(cogs)}</div></div><div class="tile ${tS-cogs>=0?'good':'bad'}"><div class="lbl">Brüt kâr</div><div class="val num">${fmt(tS-cogs)}</div><div class="cap">${tS?((tS-cogs)/tS*100).toFixed(1):0}% marj</div></div><div class="tile warn"><div class="lbl">Giderler</div><div class="val num">${fmt(tG)}</div></div><div class="tile ${tS-cogs-tG>=0?'good':'bad'}"><div class="lbl">Net (yaklaşık)</div><div class="val num">${fmt(tS-cogs-tG)}</div><div class="cap">brüt kâr − giderler</div></div></div>
 <div class="card"><header><h2>Aylık özet ${y}</h2></header>${tbl([{h:'Ay',f:m=>m.l},{h:'Satış',r:1,f:m=>m.satis?fmt(m.satis):''},{h:'Alış',r:1,f:m=>m.alis?fmt(m.alis):''},{h:'Tahsilat',r:1,f:m=>m.tah?fmt(m.tah):''},{h:'Gider',r:1,f:m=>m.gider?fmt(m.gider):''},{h:'Nakit net',r:1,f:m=>{const v=m.tah-m.gider;return v?`<span style="color:${v<0?'var(--bad)':'var(--good)'}">${fmt(v)}</span>`:''}}],[...ay,{l:'TOPLAM',satis:tS,alis:tA,tah:tT,gider:tG}])}</div>
 <div class="grid2">
  <div class="card"><header><h2>Müşteri sıralaması ${y}</h2></header>${tbl([{h:'Müşteri',f:r=>esc(cariAd(r[0])),wrap:1},{h:'Satış',r:1,f:r=>fmt(r[1])},{h:'Pay',r:1,f:r=>tS?(r[1]/tS*100).toFixed(1)+'%':''}],Object.entries(musteri).sort((a,b)=>b[1]-a[1]))}</div>
  <div class="card"><header><h2>Ürün satışları ${y}</h2></header>${tbl([{h:'Ürün',f:r=>esc(urunById(r[0])?.ad||'?'),wrap:1},{h:'Miktar',r:1,f:r=>fmtQ(r[1].q)+' '+(urunById(r[0])?.birim||'')},{h:'Tutar',r:1,f:r=>fmt(r[1].v)}],Object.entries(urunS).sort((a,b)=>b[1].v-a[1].v))}</div>

}
function exportCSV(){
 const rows=[['Tür','No','Tarih','Cari','Ara toplam','KDV','Toplam','Vade','Not']];
 DB.satis.forEach(s=>rows.push(['Satış',s.no,s.tarih,cariAd(s.cariId),belgeAra(s),belgeKdv(s),belgeToplam(s),s.vade,s.not]));
 DB.alis.forEach(s=>rows.push(['Alış',s.no,s.tarih,cariAd(s.cariId),belgeAra(s),belgeKdv(s),belgeToplam(s),s.vade,s.not]));
 DB.kasa.forEach(k=>rows.push([k.tip,k.hesap,k.tarih,k.cariId?cariAd(k.cariId):k.kategori,'','',k.tip==='tahsilat'?k.tutar:-k.tutar,'',k.aciklama]));
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 navigator.clipboard.writeText(csv).then(()=>toast('CSV panoya kopyalandı — Excel\'e yapıştırın')).catch(()=>toast('Kopyalanamadı'));
}

 <table class="it"><thead><tr><th style="width:40px">${L.n}</th><th>${L.desc}</th><th style="width:110px;text-align:center">${L.qty}</th><th style="width:130px;text-align:center">${L.price}<br><small>(${t.para}${birimler.length===1?'/'+esc(birimler[0]):''})</small></th><th style="width:150px;text-align:right">${L.total}</th></tr></thead>
 <tbody>${rows}</tbody>
 <tfoot><tr><td></td><td class="c">${L.tq}</td><td class="c">${birimler.length===1?fmtQ(tq)+' '+esc(birimler[0]):''}</td><td class="c">${L.base}</td><td class="r">${f(tkNet(t))}</td></tr><tr><td></td><td></td><td></td><td class="c">${L.vat} ${t.kdv}%</td><td class="r">${f(tkKdv(t))}</td></tr><tr><td></td><td></td><td></td><td class="c">${L.gt}</td><td class="r">${f(tkTop(t))}</td></tr></tfoot></table>
 ${t.not?`<p style="margin-top:14px;white-space:pre-line">${esc(t.not)}</p>`:''}
 <div class="foot"><div class="terms"><table><tr><td>${L.place}</td><td>:</td><td>${esc(t.teslimYeri||'')}</td></tr><tr><td>${L.time}</td><td>:</td><td>${esc(t.teslimSuresi||'')}</td></tr><tr><td>${L.origin}</td><td>:</td><td>${esc(t.mensei||'')}</td></tr>${t.odemeKosulu?`<tr><td>${L.pay}</td><td>:</td><td>${esc(t.odemeKosulu)}</td></tr>`:''}</table></div>
 ${b?`<div class="bank"><table><tr><td>${L.bank}</td><td>${esc(b.banka)}</td></tr>${b.hesap?`<tr><td>${L.acc} (${esc(b.para)}):</td><td>${esc(b.hesap)}</td></tr>`:''}${b.iban?`<tr><td>IBAN:</td><td style="font-size:13px">${esc(b.iban)}</td></tr>`:''}${b.swift?`<tr><td>SWIFT:</td><td>${esc(b.swift)}</td></tr>`:''}</table></div>`:''}</div>
 <div class="sig"><div>${L.regards}<br><b>${esc(t.imzalayan||'')}</b><div class="note">${t.tip==='proforma'?L.note:L.noteq}</div></div><div>${a.kase?`<img class="kase" src="${a.kase}">`:''}</div></div>
 </div><div class="bot"><span>${esc(a.email||'')}</span><span>${esc(a.tel||'')}</span><span>${esc(a.web||'')}</span></div>
 <div class="noprint" style="text-align:center;padding:18px"><button onclick="print()" style="padding:10px 22px;font-size:14px;border:0;background:#1e3a6e;color:#fff;border-radius:6px;cursor:pointer">PDF / Print</button></div>
 </body></html>`;
}
function yazdirTeklif(id){ const t=DB.teklif.find(x=>x.id===id); if(!t) return; const w=window.open('','_blank'); if(!w){ toast('Açılır pencere engellendi; tarayıcıda izin verin'); return; } w.document.open(); w.document.write(teklifHTML(t)); w.document.close(); }
/* ---- Ayarlar: firma kimliği, banka hesapları, logo/kaşe ---- */
function vFirmaEk(){
 ayarTamamla(); const a=DB.ayar;
 return `<div class="card"><header><h2>Belge kimliği (teklif / proforma)</h2></header><form class="body frm" onsubmit="return saveAyar(event)">${fld('PIB',inp('pib',a.pib))}${fld('Matični broj',inp('maticni',a.maticni))}${fld('Telefon',inp('tel',a.tel))}${fld('Web',inp('web',a.web))}${fld('İmzalayan',inp('imzalayan',a.imzalayan))}${fld('Teklif geçerliliği (gün)',inp('gecerlilik',a.gecerlilik,'number'))}${fld('Varsayılan teslim yeri',inp('teslimYeri',a.teslimYeri))}${fld('Varsayılan teslim süresi',inp('teslimSuresi',a.teslimSuresi))}${fld('Varsayılan menşei',inp('mensei',a.mensei))}${fld('Varsayılan ödeme koşulu',inp('odemeKosulu',a.odemeKosulu))}${fld('Logo (PNG/JPG)',`<input type="file" accept="image/*" onchange="resimAyar(this,'logo')">${a.logo?`<img src="${a.logo}" style="max-height:60px;margin-top:6px"> <button type="button" class="btn sm" onclick="DB.ayar.logo='';save();render()">Kaldır</button>`:'<span class="note">Yüklenmezse DunaSava logosu basılır</span>'}`)}${fld('Kaşe / imza (PNG)',`<input type="file" accept="image/*" onchange="resimAyar(this,'kase')">${a.kase?`<img src="${a.kase}" style="max-height:60px;margin-top:6px"> <button type="button" class="btn sm" onclick="DB.ayar.kase='';save();render()">Kaldır</button>`:''}`)}<div class="full"><button class="btn pri" type="submit">Kaydet</button></div></form></div>
 <div class="card"><header><h2>Banka hesapları</h2><button class="btn sm pri" onclick="editBanka()">+ Hesap</button></header>${tbl([{h:'Banka',f:b=>`<b>${esc(b.banka)}</b>`},{h:'Hesap no',f:b=>esc(b.hesap||'—')},{h:'IBAN',f:b=>esc(b.iban||'—')},{h:'SWIFT',f:b=>esc(b.swift||'—')},{h:'Para birimi',f:b=>b.para},{h:'',f:b=>`<button class="btn sm" onclick="editBanka('${b.id}')">Düzenle</button> <button class="btn sm danger" onclick="DB.ayar.bankalar=DB.ayar.bankalar.filter(x=>x.id!=='${b.id}');save();render()">Sil</button>`}],a.bankalar,{empty:'Banka hesabı yok'})}</div>`;
}
function editBanka(id){ const b=id?DB.ayar.bankalar.find(x=>x.id===id):{para:'RSD'}; modal(id?'Hesabı düzenle':'Banka hesabı',fld('Banka adı',inp('banka',b.banka),0,1)+fld('Para birimi',sel('para',['RSD','EUR','USD','TRY'].map(x=>({v:x,t:x})),b.para))+fld('Hesap no (yerel)',inp('hesap',b.hesap))+fld('IBAN',inp('iban',b.iban))+fld('SWIFT / BIC',inp('swift',b.swift)),d=>{ if(!req(d,['banka'])) return false; if(id) Object.assign(b,d); else DB.ayar.bankalar.push({id:uid(),...d}); toast('Hesap kaydedildi'); }); }
function resimAyar(inp_,alan){ const f=inp_.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,600/im.width,300/im.height); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); DB.ayar[alan]=c.toDataURL('image/png'); save(); render(); toast('Görsel kaydedildi'); }; im.src=e.target.result; }; r.readAsDataURL(f); }

/* ===================== RENDER ===================== */
const VIEWS={ozet:vOzet,cari:vCari,satis:()=>vBelge('satis'),alis:()=>vBelge('alis'),kasa:vKasa,stok:vStok,fiyat:vFiyat,arac:vArac,depo:vDepo,rapor:vRapor,ayar:vAyar,teklif:vTeklif};
function render(){ if(!ME||!DB) return; renderNav(); $('#main').innerHTML=(VIEWS[VIEW]||vOzet)(); const ls=$('#langslot'); if(ls) ls.innerHTML=langSwitcher(); const ui=$('#uinfo'); if(ui) ui.innerHTML=`<div><b>${esc(ME.ad||ME.email)}</b><span id="syncdot" class="syncdot"></span>${ME.rol==='admin'?'Yönetici':'Kullanıcı'} · bulut</div><button onclick="logout()">Çıkış</button>`; translateDOM(document.querySelector('.app')); }
try{ const h=location.hash.replace('#',''); if(VIEWS[h]) VIEW=h; }catch(e){}
/* oturum: auth.onAuthStateChanged yönetir */

/* ---- Kullanıcı yönetimi (Ayarlar) ---- */
function vKullanicilar(){
 return `<div class="card"><header><h2>Kullanıcılar &amp; giriş</h2>${isAdmin()?`<button class="btn sm pri" onclick="editUser()">+ Kullanıcı</button>`:''}</header>
 ${tbl([{h:'Ad',f:u=>esc(u.ad||'')},{h:'E-posta',f:u=>esc(u.email)},{h:'Rol',f:u=>u.rol==='admin'?'<span class="pill acc">Yönetici</span>':'<span class="pill">Kullanıcı</span>'},{h:'',f:u=>`${u.uid===ME.uid?`<button class="btn sm" onclick="sifreDegistir()">Şifremi değiştir</button>`:''} ${isAdmin()?`<button class="btn sm" onclick="editUser('${u.uid}')">Düzenle</button> <button class="btn sm" onclick="sifreSifirla('${esc(u.email)}')">Sıfırlama e-postası</button>`:''} ${(isAdmin()&&u.uid!==ME.uid)?`<button class="btn sm danger" onclick="delUser('${u.uid}')">Erişimi kaldır</button>`:''}`}],USERS)}
 <div class="body note">Giriş Firebase Authentication ile yapılır; şifreler Google altyapısında saklanır, bu dosyada veya tarayıcıda tutulmaz. Veriler Firestore'da (bulut) durur ve tüm cihazlarda anında eşitlenir; internet kesilirse çevrimdışı önbellekten çalışır, bağlantı gelince gönderir.</div></div>`;
}
function editUser(uid){
 const u=uid?USERS.find(x=>x.uid===uid):{email:'',ad:'',rol:'kullanici'};
 modal(uid?'Kullanıcıyı düzenle':'Yeni kullanıcı',
  fld('E-posta',inp('email',u.email,'email',uid?'readonly':''),0,1)+fld('Ad Soyad',inp('ad',u.ad))+fld('Rol',sel('rol',[{v:'kullanici',t:'Kullanıcı'},{v:'admin',t:'Yönetici'}],u.rol))+(uid?'':fld('Geçici şifre (en az 10 karakter; kullanıcı ilk girişte değiştirsin)',inp('pw','','password','autocomplete="new-password" minlength="10"'),1,1)),
  d=>{ const em=d.email.trim().toLowerCase(); if(!em){ toast('E-posta gerekli'); return false; }
   if(uid){ fdb.collection('crm_users').doc(uid).update({ad:d.ad,rol:d.rol}).then(()=>toast('Kullanıcı güncellendi')).catch(e=>toast('Hata: '+e.code)); return; }
   if(d.pw.length<10){ toast('Şifre en az 10 karakter olmalı'); return false; }
   // Yöneticinin oturumunu bozmamak için ikinci bir Firebase örneğiyle hesap açılır
   const app2=firebase.apps.find(a=>a.name==='ikincil')||firebase.initializeApp(FB_CFG,'ikincil');
   app2.auth().createUserWithEmailAndPassword(em,d.pw).then(async cred=>{ await fdb.collection('crm_users').doc(cred.user.uid).set({email:em,ad:d.ad,rol:d.rol,olusturma:firebase.firestore.FieldValue.serverTimestamp()}); await app2.auth().signOut(); toast('Kullanıcı oluşturuldu: '+em); }).catch(e=>toast(e.code==='auth/email-already-in-use'?'Bu e-posta zaten kayıtlı (Firebase). Erişim için yöneticiye kullanıcı kaydı ekletin.':'Hata: '+e.code));
  });
}
function sifreDegistir(){ modal('Şifremi değiştir',fld('Mevcut şifre',inp('eski','','password','autocomplete="current-password"'),1,1)+fld('Yeni şifre (en az 10 karakter)',inp('pw','','password','autocomplete="new-password" minlength="10"'),1,1)+fld('Yeni şifre (tekrar)',inp('pw2','','password','autocomplete="new-password"'),1,1),d=>{ if(d.pw.length<10){ toast('Şifre en az 10 karakter olmalı'); return false; } if(d.pw!==d.pw2){ toast('Şifreler eşleşmiyor'); return false; } const cred=firebase.auth.EmailAuthProvider.credential(FBU.email,d.eski); FBU.reauthenticateWithCredential(cred).then(()=>FBU.updatePassword(d.pw)).then(()=>toast('Şifre değiştirildi')).catch(e=>toast(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'?'Mevcut şifre hatalı':'Hata: '+e.code)); }); }
function sifreSifirla(email){ auth.sendPasswordResetEmail(email).then(()=>toast('Sıfırlama e-postası gönderildi: '+email)).catch(e=>toast('Hata: '+e.code)); }
function delUser(uid){ const u=USERS.find(x=>x.uid===uid); confirmDel(`<b>${esc(u?.email||'')}</b> kullanıcısının CRM erişimi kaldırılacak (giriş yapsa bile veri göremez).`,()=>{ fdb.collection('crm_users').doc(uid).delete().catch(e=>toast('Hata: '+e.code)); }); }
</script>
